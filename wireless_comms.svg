<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1a"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="radioBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <radialGradient id="towerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200M0 700H1200"/>
    <path d="M100 0V800M200 0V800M300 0V800M400 0V800M500 0V800M600 0V800M700 0V800M800 0V800M900 0V800M1000 0V800M1100 0V800"/>
  </g>

  <!-- ambient glow -->
  <ellipse cx="880" cy="380" rx="420" ry="360" fill="url(#glow)"/>

  <!-- ==================== WALKIE-TALKIE (left) ==================== -->
  <g transform="translate(230,160)">
    <!-- antenna -->
    <rect x="158" y="-170" width="14" height="150" rx="7" fill="#334155"/>
    <circle cx="165" cy="-176" r="12" fill="#f87171" filter="url(#softGlow)"/>
    <!-- grip bottom -->
    <rect x="70" y="400" width="190" height="70" rx="18" fill="#1e293b"/>
    <!-- body -->
    <rect x="70" y="60" width="190" height="350" rx="24" fill="url(#radioBody)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>
    <!-- top ridge -->
    <rect x="84" y="46" width="162" height="30" rx="12" fill="#334155"/>
    <!-- channel knob -->
    <circle cx="200" cy="62" r="13" fill="#0ea5e9"/>
    <circle cx="200" cy="62" r="6" fill="#082f49"/>
    <path d="M120 62h30" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <!-- screen -->
    <rect x="100" y="105" width="130" height="80" rx="10" fill="url(#screen)" stroke="#0891b2" stroke-width="2"/>
    <!-- signal bars on screen -->
    <rect x="118" y="160" width="12" height="12" rx="2" fill="#34d399"/>
    <rect x="136" y="154" width="12" height="18" rx="2" fill="#34d399"/>
    <rect x="154" y="148" width="12" height="24" rx="2" fill="#fbbf24"/>
    <rect x="172" y="140" width="12" height="32" rx="2" fill="#34d399"/>
    <text x="196" y="168" fill="#a5f3fc" font-family="Arial" font-size="16" font-weight="bold">CH 07</text>
    <text x="118" y="122" fill="#7dd3fc" font-family="Arial" font-size="13">TX RX</text>
    <circle cx="216" cy="122" r="5" fill="#f87171" opacity="0.9"/>
    <!-- speaker grille -->
    <g fill="#0b1220">
      <circle cx="118" cy="235" r="5"/><circle cx="140" cy="235" r="5"/><circle cx="162" cy="235" r="5"/><circle cx="184" cy="235" r="5"/><circle cx="206" cy="235" r="5"/><circle cx="228" cy="235" r="5"/>
      <circle cx="118" cy="257" r="5"/><circle cx="140" cy="257" r="5"/><circle cx="162" cy="257" r="5"/><circle cx="184" cy="257" r="5"/><circle cx="206" cy="257" r="5"/><circle cx="228" cy="257" r="5"/>
      <circle cx="118" cy="279" r="5"/><circle cx="140" cy="279" r="5"/><circle cx="162" cy="279" r="5"/><circle cx="184" cy="279" r="5"/><circle cx="206" cy="279" r="5"/><circle cx="228" cy="279" r="5"/>
    </g>
    <!-- PTT button -->
    <rect x="88" y="315" width="64" height="34" rx="8" fill="#fbbf24"/>
    <text x="120" y="336" text-anchor="middle" fill="#78350f" font-family="Arial" font-size="13" font-weight="bold">PTT</text>
    <!-- rotary / volume -->
    <circle cx="228" cy="332" r="16" fill="#334155"/>
    <circle cx="228" cy="332" r="9" fill="#0ea5e9"/>
    <!-- signal arcs from antenna -->
    <g fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.9" filter="url(#softGlow)">
      <path d="M200 -176 a40 40 0 0 1 0 34"/>
      <path d="M225 -176 a68 68 0 0 1 0 58" opacity="0.7"/>
      <path d="M252 -176 a96 96 0 0 1 0 82" opacity="0.45"/>
    </g>
  </g>

  <!-- ==================== REPEATER TOWER (right) ==================== -->
  <g transform="translate(760,120)">
    <!-- glow behind tower -->
    <circle cx="190" cy="300" r="300" fill="url(#towerGlow)"/>
    <!-- shelter -->
    <rect x="90" y="520" width="200" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="150" y="555" width="80" height="55" rx="6" fill="#0b1220"/>
    <circle cx="172" cy="582" r="4" fill="#34d399"/>
    <circle cx="190" cy="582" r="4" fill="#fbbf24"/>
    <circle cx="208" cy="582" r="4" fill="#34d399"/>
    <!-- tower mast (left leg) -->
    <polygon points="120,520 190,40 190,40" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
    <!-- tower mast (right leg) -->
    <polygon points="260,520 190,40" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
    <!-- cross braces -->
    <g stroke="#475569" stroke-width="5" stroke-linecap="round">
      <path d="M128 480 L252 420"/>
      <path d="M252 480 L128 420"/>
      <path d="M134 390 L246 330"/>
      <path d="M246 390 L134 330"/>
      <path d="M140 300 L240 240"/>
      <path d="M240 300 L140 240"/>
      <path d="M146 210 L234 150"/>
      <path d="M234 210 L146 150"/>
      <path d="M152 120 L228 70"/>
      <path d="M228 120 L152 70"/>
    </g>
    <!-- top platform -->
    <rect x="140" y="26" width="100" height="18" rx="6" fill="#475569"/>
    <!-- main antenna -->
    <rect x="186" y="-140" width="8" height="170" rx="4" fill="#64748b"/>
    <!-- antenna elements -->
    <rect x="178" y="-110" width="24" height="6" rx="3" fill="#94a3b8"/>
    <rect x="178" y="-85" width="24" height="6" rx="3" fill="#94a3b8"/>
    <rect x="178" y="-60" width="24" height="6" rx="3" fill="#94a3b8"/>
    <!-- side antenna -->
    <rect x="140" y="30" width="6" height="150" rx="3" fill="#475569"/>
    <rect x="134" y="60" width="18" height="5" rx="2.5" fill="#64748b"/>
    <rect x="134" y="90" width="18" height="5" rx="2.5" fill="#64748b"/>
    <!-- beacon light -->
    <circle cx="190" cy="-150" r="11" fill="#f87171" filter="url(#softGlow)"/>
    <!-- signal arcs from main antenna -->
    <g fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.9" filter="url(#softGlow)">
      <path d="M215 -150 a45 45 0 0 1 0 38"/>
      <path d="M242 -150 a75 75 0 0 1 0 64" opacity="0.7"/>
      <path d="M271 -150 a105 105 0 0 1 0 90" opacity="0.45"/>
    </g>
    <!-- backhaul dish -->
    <g transform="translate(60,300) rotate(-35)">
      <ellipse cx="0" cy="0" rx="55" ry="62" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="3"/>
      <ellipse cx="0" cy="0" rx="38" ry="44" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="18" ry="22" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#00e5ff"/>
    </g>
  </g>

  <!-- bridge signal between them -->
  <g fill="none" stroke="#00e5ff" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <path d="M500 420 q60 -90 140 -60"/>
    <path d="M470 480 q90 -120 200 -90" opacity="0.6"/>
  </g>

  <!-- labels -->
  <g font-family="Arial" font-size="26" font-weight="bold" fill="#7dd3fc" letter-spacing="3">
    <text x="230" y="735" text-anchor="middle">WALKIE-TALKIE</text>
    <text x="950" y="735" text-anchor="middle">REPEATER TOWER</text>
  </g>
  <g font-family="Arial" font-size="17" fill="#64748b" letter-spacing="2">
    <text x="230" y="762" text-anchor="middle">HANDHELD TWO-WAY RADIO</text>
    <text x="950" y="762" text-anchor="middle">EXTENDED COVERAGE NETWORK</text>
  </g>
</svg>
